name: Build and deploy

# Manual only.
#
# This repository's Pages source is a BRANCH, not GitHub Actions, so GitHub's
# own "pages build and deployment" pipeline publishes the site from main's root
# — which is why index.html is the committed build. actions/deploy-pages fails
# by design under a branch source, so running this on every push would paint
# the history red for no benefit.
#
# Switch Settings → Pages → Source to "GitHub Actions" to use this instead, and
# restore the push trigger below.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
